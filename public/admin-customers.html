<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pelanggan — Backseat Barista</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--gold:#c8973a;--brown:#1a0e07;--cream:#f5efe6;}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);margin:0;}
    .sidebar{background:var(--brown);color:white;}
    .sidebar-link{transition:all .2s; border-left: 3px solid transparent;}
    .sidebar-link:hover, .sidebar-link.active{background:rgba(255,255,255,.05); border-left-color:var(--gold); color:var(--gold);}
  </style>
</head>
<body class="flex min-h-screen">
  <aside class="sidebar fixed w-64 h-full flex flex-col hidden md:flex z-50">
    <div class="p-6 pb-2 border-b border-white/10">
      <div class="text-2xl mb-1">☕</div>
      <div class="font-bold text-xl" style="font-family:'Cormorant Garamond',serif;">Backseat Admin</div>
    </div>
    <nav class="flex-1 py-4 space-y-1">
      <a href="/admin" class="sidebar-link flex items-center px-6 py-3 text-sm font-medium text-stone-300"><span class="w-6">📊</span> Dashboard</a>
      <a href="/admin-products" class="sidebar-link flex items-center px-6 py-3 text-sm font-medium text-stone-300"><span class="w-6">📦</span> Produk</a>
      <a href="/admin-orders" class="sidebar-link flex items-center px-6 py-3 text-sm font-medium text-stone-300"><span class="w-6">🛒</span> Pesanan</a>
      <a href="/admin-customers" class="sidebar-link active flex items-center px-6 py-3 text-sm font-medium"><span class="w-6">👥</span> Pelanggan</a>
    </nav>
  </aside>

  <main class="flex-1 md:ml-64 p-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold" style="font-family:'Cormorant Garamond',serif;">Daftar Pelanggan</h1>
      <p class="text-stone-500 text-sm mt-1">Data pengguna yang terdaftar sebagai customer.</p>
    </header>

    <div class="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-stone-50 border-b border-stone-200 text-xs uppercase tracking-wider text-stone-500">
              <th class="p-4 font-semibold">Nama & Email</th>
              <th class="p-4 font-semibold">No. Telepon</th>
              <th class="p-4 font-semibold">Alamat</th>
              <th class="p-4 font-semibold">Tanggal Daftar</th>
            </tr>
          </thead>
          <tbody id="table-body" class="text-sm divide-y divide-stone-100"></tbody>
        </table>
      </div>
    </div>
    <div class="fixed bottom-7 right-7 opacity-50 hover:opacity-100 transition-opacity">
      <div class="w-12 h-12 rounded-full shadow-xl flex items-center justify-center text-xl bg-stone-900 border-2 border-stone-700 cursor-help" title="BrewBot (Admin Mode - Disabled)">☕</div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('bb_token');
    const H = {'Authorization':'Bearer '+token, 'Content-Type':'application/json'};
    if (!token) window.location.href='/login';

    async function loadCustomers() {
      const res = await fetch('/api/admin/customers', {headers:H});
      const data = await res.json();
      document.getElementById('table-body').innerHTML = data.map(c => `
        <tr class="hover:bg-stone-50 transition">
          <td class="p-4">
            <div class="font-semibold text-stone-800">${c.name}</div>
            <div class="text-xs text-stone-500">${c.email}</div>
          </td>
          <td class="p-4 text-stone-700">${c.phone || '-'}</td>
          <td class="p-4 text-stone-600 text-xs">${c.address || '-'}</td>
          <td class="p-4 text-stone-500">${new Date(c.created_at).toLocaleDateString('id-ID')}</td>
        </tr>
      `).join('');
    }
    loadCustomers();
  </script>
</body>
</html>
