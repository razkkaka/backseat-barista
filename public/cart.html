<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Keranjang — Backseat Barista</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--gold:#c8973a;--brown:#1a0e07;--cream:#f5efe6;}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);margin:0;}
    .nav-glass{background:rgba(26,14,7,.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(200,151,58,.15);}
    .btn-gold{background:linear-gradient(135deg,var(--gold),#a87a2e);transition:all .3s;}
    .btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,151,58,.4);}
    input:focus{outline:none;border-color:var(--gold)!important;}
    .qty-btn{width:32px;height:32px;border-radius:8px;border:1px solid #e7e5e4;font-size:16px;font-weight:700;color:#1a0e07;background:white;transition:.15s;}
    .qty-btn:hover{background:var(--brown);color:white;}
    .modal-bg{background:rgba(26,14,7,.7);backdrop-filter:blur(8px);}
  </style>
</head>
<body>
<nav class="nav-glass fixed top-0 w-full z-50">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 text-white font-semibold" style="font-family:'Cormorant Garamond',serif;">☕ Backseat Barista</a>
    <div id="nav-right" class="flex items-center gap-3 text-sm"></div>
  </div>
</nav>

<div class="pt-24 pb-20 max-w-5xl mx-auto px-6">
  <div class="flex items-center gap-4 mb-10">
    <h1 class="text-4xl font-bold" style="font-family:'Cormorant Garamond',serif;">Keranjang Belanja</h1>
    <span id="cart-count" class="bg-stone-900 text-white text-xs font-bold w-7 h-7 rounded-full flex items-center justify-center">0</span>
  </div>

  <div id="cart-empty" class="hidden text-center py-24">
    <div class="text-6xl mb-5">🛒</div>
    <h2 class="text-2xl font-semibold mb-3 serif" style="font-family:'Cormorant Garamond',serif;">Keranjang Masih Kosong</h2>
    <p class="text-stone-500 mb-8">Belum ada minuman yang ditambahkan. Yuk pilih menu favoritmu!</p>
    <a href="/menu" class="btn-gold inline-block px-8 py-3.5 rounded-full text-white font-semibold text-sm">Lihat Menu →</a>
  </div>

  <div id="cart-content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Items -->
    <div class="lg:col-span-2 space-y-4" id="cart-items"></div>
    
    <!-- Summary -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-sm sticky top-24">
        <h2 class="font-bold text-lg mb-5 serif" style="font-family:'Cormorant Garamond',serif;">Ringkasan Pesanan</h2>
        <div id="summary-items" class="space-y-2 mb-4 text-sm"></div>
        <div class="border-t border-stone-100 pt-4 mb-5">
          <div class="flex justify-between text-sm text-stone-500 mb-1"><span>Subtotal</span><span id="subtotal">-</span></div>
          <div class="flex justify-between font-bold text-base"><span>Total</span><span id="total" style="color:var(--brown);">-</span></div>
        </div>
        <button onclick="openCheckout()" id="btn-checkout" class="btn-gold w-full text-white py-4 rounded-xl font-semibold text-sm tracking-wide shadow-lg">Checkout →</button>
        <a href="/menu" class="block text-center text-sm text-stone-500 hover:text-stone-700 mt-4 transition">← Lanjut Belanja</a>
      </div>
    </div>
  </div>
</div>

<!-- Checkout Modal -->
<div id="checkout-modal" class="hidden fixed inset-0 modal-bg z-50 flex items-center justify-center p-4" onclick="closeCheckoutModal(event)">
  <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl" onclick="event.stopPropagation()">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-bold" style="font-family:'Cormorant Garamond',serif;">Konfirmasi Checkout</h3>
      <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="text-stone-400 hover:text-stone-700 text-xl">✕</button>
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">Alamat Pengiriman / Pickup</label>
      <input type="text" id="delivery-addr" placeholder="Jl. Cibanteng Raya No.12" class="w-full bg-stone-50 border border-stone-200 px-4 py-3 rounded-xl text-sm mb-4">
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">Catatan (opsional)</label>
      <input type="text" id="order-notes" placeholder="Gula dikurangi, dll." class="w-full bg-stone-50 border border-stone-200 px-4 py-3 rounded-xl text-sm mb-6">
    </div>
    <div class="bg-stone-50 rounded-2xl p-4 mb-6">
      <div class="flex justify-between text-sm mb-2"><span class="text-stone-500">Total Pembayaran</span><span class="font-bold text-lg" style="color:var(--brown);" id="modal-total">—</span></div>
      <div class="text-xs text-stone-400">Pembayaran via Transfer Bank. Upload bukti setelah checkout.</div>
    </div>
    <div id="checkout-err" class="hidden mb-4 text-sm text-red-600 bg-red-50 px-4 py-3 rounded-xl"></div>
    <button onclick="doCheckout()" id="btn-co" class="btn-gold w-full text-white py-4 rounded-xl font-semibold text-sm shadow-lg">✅ Konfirmasi Pesanan</button>
  </div>
</div>

<script>
  const token = localStorage.getItem('bb_token');
  const user = JSON.parse(localStorage.getItem('bb_user')||'null');
  
  if (!token) window.location.href = '/login';
  
  const H = {'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  
  // Nav
  document.getElementById('nav-right').innerHTML = `
    <a href="/favorites" class="text-stone-300 hover:text-white transition">♡</a>
    <a href="/cart" class="text-white transition">🛒</a>
    <a href="/orders" class="text-stone-300 hover:text-white text-sm transition">Pesanan</a>
    <button onclick="localStorage.clear();window.location.href='/'" class="text-stone-400 hover:text-white text-sm">Keluar</button>
  `;
  
  let cartData = [];
  
  async function loadCart() {
    const res = await fetch('/api/cart', {headers:H});
    cartData = await res.json();
    
    if (!cartData.length) {
      document.getElementById('cart-empty').classList.remove('hidden');
      document.getElementById('cart-content').classList.add('hidden');
      document.getElementById('cart-count').textContent = '0';
      return;
    }
    
    document.getElementById('cart-empty').classList.add('hidden');
    document.getElementById('cart-content').classList.remove('hidden');
    document.getElementById('cart-count').textContent = cartData.length;
    
    document.getElementById('cart-items').innerHTML = cartData.map(i => `
      <div class="bg-white rounded-2xl p-5 border border-stone-100 shadow-sm flex items-center gap-4">
        <img src="${i.image_url}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0 border border-stone-100" onerror="this.src='https://via.placeholder.com/80'">
        <div class="flex-1">
          <h3 class="font-semibold text-stone-800 mb-1">${i.name}</h3>
          <div class="text-sm font-bold" style="color:var(--brown);">Rp ${Number(i.price).toLocaleString('id-ID')}</div>
          <div class="text-xs text-stone-400 mt-0.5">Stok: ${i.stock}</div>
        </div>
        <div class="flex items-center gap-3">
          <button class="qty-btn" onclick="updateQty(${i.id},${i.quantity-1})">−</button>
          <span class="font-bold text-stone-800 w-8 text-center">${i.quantity}</span>
          <button class="qty-btn" onclick="updateQty(${i.id},${i.quantity+1})">+</button>
        </div>
        <div class="text-sm font-bold min-w-24 text-right" style="color:var(--brown);">Rp ${(Number(i.price)*i.quantity).toLocaleString('id-ID')}</div>
        <button onclick="removeItem(${i.id})" class="text-stone-300 hover:text-red-500 ml-2 transition">✕</button>
      </div>
    `).join('');
    
    const total = cartData.reduce((s,i) => s + Number(i.price)*i.quantity, 0);
    document.getElementById('subtotal').textContent = 'Rp ' + total.toLocaleString('id-ID');
    document.getElementById('total').textContent = 'Rp ' + total.toLocaleString('id-ID');
    document.getElementById('summary-items').innerHTML = cartData.map(i => `
      <div class="flex justify-between text-stone-600"><span>${i.name} x${i.quantity}</span><span>Rp ${(Number(i.price)*i.quantity).toLocaleString('id-ID')}</span></div>
    `).join('');
  }
  
  async function updateQty(id, qty) {
    if (qty <= 0) { removeItem(id); return; }
    const res = await fetch('/api/cart/'+id, {method:'PUT',headers:H,body:JSON.stringify({quantity:qty})});
    const d = await res.json();
    if (!res.ok) alert('⚠ ' + d.error);
    loadCart();
  }
  
  async function removeItem(id) {
    await fetch('/api/cart/'+id, {method:'DELETE',headers:H});
    loadCart();
  }
  
  function openCheckout() {
    const total = cartData.reduce((s,i) => s + Number(i.price)*i.quantity, 0);
    document.getElementById('modal-total').textContent = 'Rp ' + total.toLocaleString('id-ID');
    document.getElementById('checkout-modal').classList.remove('hidden');
  }
  
  function closeCheckoutModal(e) { 
    if (e.target === document.getElementById('checkout-modal')) document.getElementById('checkout-modal').classList.add('hidden'); 
  }
  
  async function doCheckout() {
    const btn = document.getElementById('btn-co');
    const err = document.getElementById('checkout-err');
    err.classList.add('hidden');
    btn.textContent = 'Memproses...'; btn.disabled = true;
    
    const res = await fetch('/api/orders/checkout', {
      method:'POST',
      headers:H,
      body:JSON.stringify({
        delivery_address: document.getElementById('delivery-addr').value,
        notes: document.getElementById('order-notes').value
      })
    });
    
    const d = await res.json();
    
    if (res.ok) {
      alert(`✅ Pesanan berhasil!\n\nOrder ID: ${d.order_id}\nTotal: Rp ${Number(d.total).toLocaleString('id-ID')}\n\nSilakan lakukan pembayaran dan upload bukti transfer.`);
      window.location.href = '/orders';
    } else { 
      err.textContent = '⚠ ' + d.error; 
      err.classList.remove('hidden'); 
      btn.textContent='✅ Konfirmasi Pesanan'; 
      btn.disabled=false; 
    }
  }
  
  loadCart();
</script>
</body>
</html>
